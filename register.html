<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body></title>
   

    <form action="">

        <legend>Join Us and Start Your Journey Today!!</legend>
        <br>

        <label for="fullname">FullName :</label>
        <input type="text" placeholder="e.g Jane Doe" id="fullame" required>
        <br><br>

        <label for="email">Email Address :</label>
        <input type="email" placeholder="e.g abc@gmail.com" id="email">
        <br><br>

        <label for="pwd">Password :</label>
        <input type="password" placeholder="Type Password" id="pwd" required>
        <br><br>

        <label for="yob">Year of Birth :</label>
        <input type="date"id="yob" required>
        <br><br>

        
        <label for="dt">Date and Time :</label>
        <input type="datetime-local" id="dt" required>
        <br><br>

        
        <label for="phone">Phone Number :</label>
        <input type="tel"placeholder="e.g +1234567890" id="phone" required>
        <br><br>

        
        <label for="file">Upload File :</label>
        <input type="file" id="file" required>
        <br><br>
        
        <!--DropDown-->

        <!--Dadiobutton---->

        <!--checkbox-->

        <!--Textarea-->

        <button>Register</button>

        


    </form>
