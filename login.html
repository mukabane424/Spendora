<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Paget</title>

    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootstrap/js/bootstrap.min.js">
</head>
<body>

    <form action="" class="bg-info p-4 shadow mx-auto" style="max-width: 500px;">
        
       
        <legend class="fw-bold mb-4 text-dark text-center">Create Your Profile to Get Started</legend>

       
        <label for="fullname" class="form-label fw-semibold">Your Full Name :</label>
        <input type="text" placeholder="Enter your first and last name" id="fullname" class="form-control mb-3" required>

        <label for="email" class="form-label fw-semibold">Work Email Address :</label>
        <input type="email" placeholder="example@company.com" id="email" class="form-control mb-3" required>

        <label for="pwd" class="form-label fw-semibold">Security Password :</label>
        <input type="password" placeholder="Create a secure password" id="pwd" class="form-control mb-3" required>

        <label for="yob" class="form-label fw-semibold">Select Date of Birth :</label>
        <input type="date" id="yob" class="form-control mb-3" required>

        <label for="dt" class="form-label fw-semibold">Preferred Appointment Time :</label>
        <input type="datetime-local" id="dt" class="form-control mb-4" required>

       
        <button type="submit" class="btn btn-success w-100">Create Account</button>
        
    </form>


</body>
</html>
